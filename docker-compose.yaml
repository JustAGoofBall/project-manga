# syntax=docker/compose:1
#
# NOTE: the backend currently stores its data in a SQLite file (see
# config/db.js), so it does NOT connect to the `db` service below and the
# DB_* variables on the backend service are unused. Both are kept ready for
# the planned move to MySQL, which is also what schema.sql is for.
#
# To run just the app without MySQL:
#   docker compose up backend frontend

services:
  # MySQL Database - not used by the backend yet, see the note above.
  db:
    image: mysql:8.0
    container_name: manga_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: anime_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express.js Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manga_backend
    ports:
      - "3000:3000"
    environment:
      # DB_* are read by nothing today - see the note at the top of this file.
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: anime_db
      DB_PORT: 3306
      PORT: 3000
      NODE_ENV: production
      # Signs login tokens. Override this with a real secret before
      # putting this anywhere public.
      JWT_SECRET: ${JWT_SECRET:-change-me-before-deploying}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: manga_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:3000
    restart: unless-stopped

volumes:
  db_data:
